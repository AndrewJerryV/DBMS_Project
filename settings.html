<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Settings - KSRTC Bus Management</title>
    <link rel="stylesheet" href="settings.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-bus"></i></div>
                <div>
                    <h1>KSRTC Bus Management System</h1>
                    <span>Staff Portal</span>
                </div>
            </div>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>
    </header>

    <div class="container">
        <div class="notification" id="notification">
            <i class="fas fa-check-circle"></i>
            <div id="notification-message"></div>
        </div>
        
        <div class="main-content">
            <div class="profile-header">
                <div class="profile-avatar" id="profile-avatar">--</div>
                <div class="profile-info">
                    <h2 id="profile-name">Loading...</h2>
                    <p id="profile-role">Loading...</p>
                    <span class="status-badge" id="profile-status">...</span>
                </div>
            </div>

            <h2 class="section-title">
                <i class="fas fa-user-edit"></i> Edit Information
            </h2>

            <form id="settings-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <div class="input-with-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" id="name" disabled>
                        </div>
                    </div>
                     <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-with-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" required>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <div class="input-with-icon">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="phone" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="role">Role</label>
                         <div class="input-with-icon">
                            <i class="fas fa-briefcase"></i>
                            <input type="text" id="role" disabled>
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div>&copy; 2025 KSRTC Bus Management System. All rights reserved.</div>
        </div>
    </footer>

    <script src="settings.js"></script>
</body>
</html>
