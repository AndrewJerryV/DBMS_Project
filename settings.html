<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - KSRTC Bus Management</title>
    <link rel="icon" href="assets/icon32.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
          --primary: #F0652B;
          --primary-dark: #c94c1f;
          --primary-light: #ff8c5c;
          --body-bg: #f5f7fa;
          --sidebar-bg: #2c3e50;
          --card-bg: white;
          --text-dark: #2c3e50;
          --text-light: #7f8c8d;
          --gray: #95a5a6;
          --input-border: #dfe4ea;
          --success: #2ecc71;
          --danger: #e74c3c;
          --border-radius: 12px;
          --box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
          --transition: all 0.3s ease;
        }

        body.dark-theme {
          --body-bg: #0f172a;
          --sidebar-bg: #1a2a3a;
          --card-bg: #1e293b;
          --text-dark: #e2e8f0;
          --text-light: #94a3b8;
          --gray: #94a3b8;
          --input-border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--body-bg);
            color: var(--text-dark);
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            width: 95%;
            margin: 30px auto;
        }

        header {
            background: var(--card-bg);
            padding: 15px 2.5%;
            box-shadow: var(--box-shadow);
            margin-bottom: 30px;
            border-radius: var(--border-radius);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { display: flex; align-items: center; gap: 15px; }
        .logo img { width: 40px; }
        .logo h1 { font-size: 22px; color: var(--text-dark); }

        .back-link {
            color: var(--text-dark); text-decoration: none;
            background: var(--body-bg); padding: 8px 15px;
            border-radius: 30px; transition: var(--transition);
            font-weight: 500;
        }
        .back-link:hover { background: var(--primary); color: white; }

        /* NEW: Two-column grid layout for settings */
        .settings-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
        }

        /* NEW: Profile summary card on the left */
        .profile-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 30px;
            text-align: center;
        }

        .profile-avatar {
            width: 100px; height: 100px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 40px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin: 0 auto 20px;
        }

        .profile-card h2 { color: var(--text-dark); margin-bottom: 5px; }
        .profile-card p { color: var(--text-light); margin-bottom: 15px; font-size: 14px; }

        .status-badge {
            display: inline-block; padding: 4px 12px;
            background-color: var(--success); color: white;
            border-radius: 20px; font-size: 12px; font-weight: 500;
        }

        /* NEW: Container for the form cards on the right */
        .forms-container { display: flex; flex-direction: column; gap: 30px; }
        
        /* NEW: Styling for individual form cards */
        .form-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .form-card::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--primary-light) 0%, var(--primary) 100%);
        }

        .section-title {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 25px; color: var(--text-dark);
            padding-bottom: 15px; border-bottom: 1px solid var(--input-border);
        }
        .section-title i { font-size: 22px; color: var(--primary); }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-dark); }
        .input-with-icon { position: relative; }
        .input-with-icon i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--gray); }
        .input-with-icon input { padding-left: 45px; }
        
        input {
            width: 100%; padding: 12px 15px;
            border: 1px solid var(--input-border);
            background-color: var(--body-bg); color: var(--text-dark);
            border-radius: var(--border-radius); font-size: 16px;
            transition: var(--transition);
        }
        input:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(240, 101, 43, 0.2);
        }
        input:disabled { background-color: #4a556828; color: var(--gray); cursor: not-allowed; }

        .btn {
            padding: 12px 25px; border: none; border-radius: var(--border-radius);
            font-size: 16px; font-weight: 500; cursor: pointer;
            transition: var(--transition); display: inline-flex;
            align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white; box-shadow: 0 2px 5px rgba(240, 101, 43, 0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(240, 101, 43, 0.4); }

        .actions { display: flex; justify-content: flex-end; margin-top: 10px; }
        
        .notification {
            padding: 15px 20px; border-radius: var(--border-radius);
            margin-bottom: 25px; display: none; align-items: center;
            gap: 12px; animation: slideInNotify 0.5s ease;
        }
        @keyframes slideInNotify { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .notification.success { background-color: rgba(46, 204, 113, 0.1); border: 1px solid var(--success); color: var(--success); }
        .notification.error { background-color: rgba(231, 76, 60, 0.1); border: 1px solid var(--danger); color: var(--danger); }
        .notification i { font-size: 20px; }

        @media (max-width: 900px) {
            .settings-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="assets/logo.png" alt="KSRTC Logo">
            <h1>Settings</h1>
        </div>
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </header>

    <div class="container">
        <div class="notification" id="notification">
            <i class="fas fa-check-circle"></i>
            <div id="notification-message"></div>
        </div>
        
        <div class="settings-grid">
            <aside class="profile-card">
                <div class="profile-avatar" id="profile-avatar">--</div>
                <h2 id="profile-name">Loading...</h2>
                <p id="profile-role-display">Loading...</p>
                <span class="status-badge" id="profile-status">...</span>
            </aside>

            <main class="forms-container">
                <div class="form-card">
                    <h2 class="section-title">
                        <i class="fas fa-user-edit"></i> Personal Information
                    </h2>
                    <form id="info-form">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <div class="input-with-icon">
                                <i class="fas fa-user"></i>
                                <input type="text" id="name" disabled>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <div class="input-with-icon">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="email" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <div class="input-with-icon">
                                <i class="fas fa-phone"></i>
                                <input type="tel" id="phone" required>
                            </div>
                        </div>
                        <div class="actions">
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Information</button>
                        </div>
                    </form>
                </div>

                <div class="form-card">
                    <h2 class="section-title">
                        <i class="fas fa-shield-alt"></i> Change Password
                    </h2>
                    <form id="password-form">
                        <div class="form-group">
                            <label for="current-password">Current Password</label>
                            <div class="input-with-icon">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="current-password" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="new-password">New Password</label>
                            <div class="input-with-icon">
                                <i class="fas fa-key"></i>
                                <input type="password" id="new-password" required>
                            </div>
                        </div>
                         <div class="form-group">
                            <label for="confirm-password">Confirm New Password</label>
                            <div class="input-with-icon">
                                <i class="fas fa-key"></i>
                                <input type="password" id="confirm-password" required>
                            </div>
                        </div>
                        <div class="actions">
                            <button type="submit" class="btn btn-primary"><i class="fas fa-sync-alt"></i> Update Password</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const API_BASE_URL = 'http://localhost:3000';
            const staffId = localStorage.getItem('staffId');

            if (!staffId) {
                // Redirect if not logged in
                window.location.href = 'staff.html';
                return;
            }

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
            }

            const infoForm = document.getElementById('info-form');
            const passwordForm = document.getElementById('password-form');
            
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const phoneInput = document.getElementById('phone');
            
            const profileAvatar = document.getElementById('profile-avatar');
            const profileName = document.getElementById('profile-name');
            const profileRoleDisplay = document.getElementById('profile-role-display');
            const profileStatus = document.getElementById('profile-status');


            async function fetchAndPopulateStaffDetails() {
                try {
                    const response = await fetch(`${API_BASE_URL}/staff/details/${staffId}`);
                    if (!response.ok) throw new Error('Failed to fetch staff details.');
                    
                    const staff = await response.json();
                    const roleFormatted = staff.role.charAt(0).toUpperCase() + staff.role.slice(1);

                    // Populate profile card
                    profileName.textContent = staff.name;
                    profileRoleDisplay.textContent = roleFormatted;
                    profileStatus.textContent = staff.status.charAt(0).toUpperCase() + staff.status.slice(1);
                    profileAvatar.textContent = staff.name.split(' ').map(n => n[0]).join('').toUpperCase();

                    // Populate form fields
                    nameInput.value = staff.name;
                    emailInput.value = staff.email;
                    phoneInput.value = staff.phone;

                } catch (error) {
                    showNotification('Could not load user data.', 'error');
                }
            }

            infoForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const updatedData = { email: emailInput.value, phone: phoneInput.value };

                try {
                    const response = await fetch(`${API_BASE_URL}/staff/${staffId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedData),
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error);
                    showNotification(result.message, 'success');
                } catch (error) {
                    showNotification(error.message, 'error');
                }
            });

            passwordForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const currentPassword = document.getElementById('current-password').value;
                const newPassword = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                if (newPassword !== confirmPassword) {
                    showNotification('New passwords do not match.', 'error');
                    return;
                }

                // NOTE: This requires a new endpoint on your server: PUT /staff/:id/password
                try {
                    const response = await fetch(`${API_BASE_URL}/staff/${staffId}/password`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ current_password: currentPassword, new_password: newPassword }),
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error);
                    showNotification(result.message, 'success');
                    passwordForm.reset();
                } catch (error) {
                    showNotification(error.message, 'error');
                }
            });

            function showNotification(message, type = 'success') {
                const notification = document.getElementById('notification');
                const messageDiv = document.getElementById('notification-message');
                const icon = notification.querySelector('i');
                
                icon.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
                messageDiv.textContent = message;
                notification.className = 'notification ' + type;
                notification.style.display = 'flex';

                setTimeout(() => { notification.style.display = 'none'; }, 4000);
            }

            fetchAndPopulateStaffDetails();
        });
    </script>
</body>
</html>
