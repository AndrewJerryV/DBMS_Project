<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login - KSRTC Bus Management</title>
  <link rel="icon" href="assets/icon32.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #F0652B;
      --primary-dark: #c94c1f;
      --primary-light: #ff8c5c;
      --dark-bg: #1f2937;
      --light-bg: #f8fafc;
      --text-dark: #1f2937;
      --text-light: #6b7280;
      --border-color: #d1d5db;
      --error: #ef4444;
      --success: #10b981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--light-bg);
      color: var(--text-dark);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Sidebar */
    .sidebar {
      background: linear-gradient(135deg, var(--dark-bg) 0%, #111827 100%);
      color: white;
      width: 45%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }

    .sidebar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" opacity="0.05"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="white" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
    }

    .logo-container {
      text-align: center;
      margin-bottom: 40px;
      z-index: 1;
    }

    .logo-container img {
      width: 120px;
      margin-bottom: 20px;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
    }

    .logo-container h1 {
      font-size: 32px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .logo-container h2 {
      color: var(--primary);
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .sidebar-features {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 30px;
      z-index: 1;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 16px;
    }

    .feature i {
      color: var(--primary);
      font-size: 20px;
      width: 24px;
    }

    /* Login Form */
    .login-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      background: var(--light-bg);
    }

    .login-box {
      background: white;
      padding: 50px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 450px;
      position: relative;
      overflow: hidden;
    }

    .login-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .login-header h2 {
      font-size: 28px;
      color: var(--text-dark);
      margin-bottom: 10px;
      font-weight: 700;
    }

    .login-header p {
      color: var(--text-light);
      font-size: 16px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-dark);
      font-size: 15px;
    }

    .input-container {
      position: relative;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      transition: all 0.3s ease;
      background: white;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(240, 101, 43, 0.2);
    }

    .input-container i {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      cursor: pointer;
      font-size: 18px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 25px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(240, 101, 43, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(240, 101, 43, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .extra {
      text-align: center;
      margin-top: 25px;
      font-size: 15px;
      color: var(--text-light);
    }

    .extra a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    .extra a:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    #error-message {
      color: var(--error);
      text-align: center;
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.1);
      font-size: 15px;
      display: none;
    }

    /* Responsive Design */
    @media (max-width: 900px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        padding: 30px 20px;
        min-height: 40vh;
      }

      .login-container {
        padding: 30px 20px;
        min-height: 60vh;
      }
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 30px 25px;
      }

      .logo-container h1 {
        font-size: 26px;
      }

      .logo-container h2 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <div class="logo-container">
      <img src="assets/logo.png" alt="KSRTC Logo">
      <h1>KSRTC Bus Management</h1>
      <h2>Staff Login Portal</h2>
    </div>
  </div>

  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h2>Staff Login</h2>
      </div>

      <div id="error-message"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-container">
            <input type="email" id="email" placeholder="Enter your email address" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-container">
            <input type="password" id="password" placeholder="Enter your password" required>
            <i class="fa-solid fa-eye-slash" id="togglePassword"></i>
          </div>
        </div>

        <button type="submit" class="btn">Login to Dashboard</button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("login-form");
      const errorMessageDiv = document.getElementById("error-message");
      const togglePassword = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("password");

      // Password visibility toggle
      togglePassword.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);

        // Toggle eye / eye-slash icon
        togglePassword.classList.toggle('fa-eye');
        togglePassword.classList.toggle('fa-eye-slash');
      });

      // Form submission
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = passwordInput.value;

        // Clear previous errors
        errorMessageDiv.style.display = 'none';
        errorMessageDiv.textContent = '';

        if (!email || !password) {
          showError("Please fill in all fields!");
          return;
        }

        if (!isValidEmail(email)) {
          showError("Please enter a valid email address!");
          return;
        }

        try {
          // Show loading state
          const submitBtn = form.querySelector('.btn');
          const originalText = submitBtn.innerHTML;
          submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
          submitBtn.disabled = true;

          const response = await fetch("http://localhost:3000/staff/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email,
              password
            })
          });

          const data = await response.json();

          if (response.ok) {
            // On successful login, save the ID and details
            localStorage.setItem('staffId', data.staffId);
            localStorage.setItem('staffDetails', JSON.stringify(data));

            // Show success message before redirect
            submitBtn.innerHTML = '<i class="fas fa-check"></i> Login Successful!';
            submitBtn.style.background = 'linear-gradient(135deg, var(--success) 0%, #0d9665 100%)';

            setTimeout(() => {
              // Redirect to the main dashboard
              window.location.href = "./index.html";
            }, 1000);
          } else {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
            showError(data.error || "Login failed. Please try again.");
          }
        } catch (err) {
          console.error(err);
          const submitBtn = form.querySelector('.btn');
          submitBtn.innerHTML = 'Login to Dashboard';
          submitBtn.disabled = false;
          showError("Server error. Please try again later.");
        }
      });

      function showError(message) {
        errorMessageDiv.textContent = message;
        errorMessageDiv.style.display = 'block';
      }

      function isValidEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
      }
    });
  </script>
</body>

</html>
